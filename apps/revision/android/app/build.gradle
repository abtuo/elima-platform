apply plugin: 'com.android.application'

// Local-only signing inputs. Never fall back to the debug signing key.
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseValue = { name -> System.getenv(name) ?: releaseProperties.getProperty(name) }
def releaseNames = ['ELIMA_RELEASE_STORE_FILE', 'ELIMA_RELEASE_STORE_PASSWORD', 'ELIMA_RELEASE_KEY_ALIAS', 'ELIMA_RELEASE_KEY_PASSWORD']
def releaseValues = releaseNames.collectEntries { [(it): releaseValue(it)] }
def missingReleaseValues = releaseNames.findAll { !releaseValues[it] }

android {
    namespace = "ci.elima.revision"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ci.elima.revision"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (missingReleaseValues.isEmpty()) {
                storeFile rootProject.file(releaseValues['ELIMA_RELEASE_STORE_FILE'])
                storePassword releaseValues['ELIMA_RELEASE_STORE_PASSWORD']
                keyAlias releaseValues['ELIMA_RELEASE_KEY_ALIAS']
                keyPassword releaseValues['ELIMA_RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def checkReleaseSigning = tasks.register('checkReleaseSigning') {
    doLast {
        if (!missingReleaseValues.isEmpty()) {
            throw new GradleException('Release signing missing: ' + missingReleaseValues.join(', ') + '. Set environment variables or android/keystore.properties locally.')
        }
        if (!rootProject.file(releaseValues['ELIMA_RELEASE_STORE_FILE']).isFile()) {
            throw new GradleException('Release keystore not found. Check ELIMA_RELEASE_STORE_FILE.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild' || name == 'validateSigningRelease') {
        dependsOn(checkReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
